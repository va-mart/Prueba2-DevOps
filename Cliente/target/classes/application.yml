spring:
  application:
    name: clientes

  datasource:
    url: jdbc:mysql://localhost:3306/clientes_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    repair: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

server:
  port: 8080

logging:
  level:
    root: INFO
    Veterinaria.Cliente: INFO
  file:
    name: logs/clientes.log

app:
  jwt:
    secret: clave-secreta-jwt-veterinaria-2025-duoc-uc-segura
    expiration-ms: 3600000
